appId: com.screen-time-monitor.app
productName: Screen Time Monitor
copyright: Copyright © 2026 Screen Time Monitor Team

files:
  - out/**/*
  - package.json

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.png
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Screen Time Monitor

extraResources:
  - from: resources/
    to: .
    filter:
      - "*.png"

publish:
  provider: github
  owner: 3013197919
  repo: screen-time-monitor
